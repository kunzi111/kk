<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Kunzi 的 Agent：一个还在学说话的对话界面，目前是本地预设回复。">
<meta name="theme-color" content="#050505">
<title>Agent · Kunzi</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500&display=swap">
<style>
/* 令牌块：与 index/work/about/orbit 四页保持一致，改一处需同步五处 */
:root{
  --bg:#050505;--fg:#fafafa;--muted:#9a9aa0;--dim:#7a7a82;
  --line:rgba(250,250,250,.13);--glass:rgba(18,18,20,.52);--accent:#99b9ff;
  --ease:cubic-bezier(.4,0,.2,1);--ease-xl:cubic-bezier(.16,1,.3,1);
  --serif:'Instrument Serif',Georgia,serif;
  --sans:'Inter Tight','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --pad:clamp(24px,5vw,64px);
}
html,body{background:var(--bg);color:var(--fg)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
h1,h2,p{margin:0}
::selection{background:var(--accent);color:#050505}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:fixed;left:16px;top:-80px;z-index:60;padding:12px 20px;border-radius:999px;background:var(--fg);color:#050505;font-size:14px;transition:top .2s}
.skip:focus{top:16px}

.brand{position:fixed;top:20px;left:var(--pad);z-index:50;font:400 22px/1 var(--serif);letter-spacing:-.02em;color:var(--fg)}
.brand i{font-style:normal;color:var(--accent)}
.nav{position:fixed;top:16px;left:0;right:0;z-index:50;margin:0 auto;width:max-content;
  display:flex;align-items:center;gap:2px;height:52px;padding:0 6px;border-radius:999px;
  background:var(--glass);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%)}
.nav a{display:flex;align-items:center;height:40px;padding:0 18px;border-radius:999px;
  font-size:14px;font-weight:500;color:rgba(250,250,250,.72);transition:color .18s var(--ease),background .18s var(--ease)}
.nav a:hover{color:var(--fg)}
.nav a[aria-current=page]{background:var(--fg);color:#050505}
.nav a[aria-current=page]:hover{color:#050505}

.shell{min-height:100svh;display:flex;flex-direction:column;
  padding:clamp(92px,13vh,124px) var(--pad) clamp(20px,3vh,32px)}
.agent-main{width:min(100%,920px);margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0}
.topline{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap}
.topline h1{font-size:clamp(24px,3vw,34px);font-weight:500;letter-spacing:-.03em;line-height:1.2}
.topline h1 i{font-style:normal;color:var(--accent)}
.topline button{font-size:13px;font-weight:500;color:var(--dim);padding:10px 0;transition:color .18s var(--ease)}
.topline button:hover{color:var(--fg)}
.note{font-size:12px;color:var(--dim);margin-top:8px;letter-spacing:.02em;
  display:flex;align-items:center;gap:7px}
.note::before{content:"";width:5px;height:5px;border-radius:999px;background:var(--accent);opacity:.75;flex:0 0 auto}

.chat{display:flex;flex-direction:column;flex:1;min-height:320px;margin-top:clamp(18px,3vh,30px)}
.welcome{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;
  gap:clamp(18px,2.6vh,26px);padding:clamp(24px,5vh,56px) 0}
.face{display:flex;align-items:center;justify-content:center;gap:13px;transform:rotate(-10deg)}
.face span{width:20px;height:44px;background:rgba(250,250,250,.9);border-radius:30px;display:block}
.face span+span{height:33px}
.welcome h2{font-size:clamp(24px,3.2vw,36px);font-weight:500;letter-spacing:-.03em;text-align:center;line-height:1.25}
.chips{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.chips button{padding:11px 18px;border:1px solid var(--line);border-radius:999px;font-size:13px;
  color:rgba(250,250,250,.8);min-height:44px;transition:background .18s var(--ease),color .18s var(--ease),border-color .18s var(--ease)}
.chips button:hover{background:var(--glass);color:var(--fg);border-color:rgba(250,250,250,.24)}

.messages{flex:1;height:0;min-height:180px;overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;padding:4px 12px 20px 0}
.message{max-width:88%;margin-bottom:22px;font-size:15px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}
.message.user{margin-left:auto;border-radius:14px;background:var(--glass);border:1px solid var(--line);
  padding:12px 17px;width:fit-content;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.message.assistant{padding:0 2px;color:rgba(250,250,250,.92)}
.message-label{display:block;color:var(--accent);font-size:12px;letter-spacing:.06em;margin-bottom:6px}

#chat-form{display:flex;align-items:flex-end;gap:12px;background:var(--glass);
  -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
  border:1px solid var(--line);padding:12px 12px 12px 20px;border-radius:20px;margin-top:16px;
  transition:border-color .2s var(--ease)}
#chat-form:focus-within{border-color:rgba(250,250,250,.28)}
textarea{resize:none;flex:1;min-width:0;border:0;background:none;color:var(--fg);
  padding:10px 0;font-size:15px;line-height:1.5;min-height:44px;max-height:160px;outline:none}
textarea::placeholder{color:var(--dim)}
.send{width:46px;height:46px;flex:0 0 auto;border-radius:14px;background:var(--fg);color:#050505;
  font-size:22px;display:grid;place-items:center;transition:transform .18s var(--ease),opacity .18s var(--ease)}
.send:hover{transform:translateY(-1px)}
.send:disabled{opacity:.4;transform:none;cursor:default}
[hidden]{display:none!important}

.foot{padding:clamp(14px,2vh,22px) var(--pad) clamp(16px,2.5vh,24px)}
.foot__inner{display:flex;justify-content:space-between;align-items:center;gap:20px;
  border-top:1px solid var(--line);padding-top:18px;font-size:12px;color:var(--dim);letter-spacing:.06em}

@media (prefers-reduced-motion:no-preference){
  .anim{opacity:0;animation:rise .9s var(--ease-xl) forwards}
  .d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}
  @keyframes rise{from{opacity:0;transform:translateY(18px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
}
@media(max-width:900px){
  .nav{top:auto;bottom:calc(14px + env(safe-area-inset-bottom));left:var(--pad);right:var(--pad);margin:0;width:auto;max-width:none;justify-content:space-between;height:56px}
  .nav a{flex:1 1 0;justify-content:center;padding:0 6px;font-size:13px;height:44px}
  .shell{padding:clamp(78px,11vh,100px) var(--pad) calc(88px + env(safe-area-inset-bottom))}
  .welcome{gap:18px;padding:20px 0}
  .chips{flex-direction:column;width:100%;max-width:280px}
  .chips button{width:100%}
  .message{max-width:94%}
  .foot{display:none}
}
</style>
</head>
<body>
<a class="skip" href="#main">跳至内容</a>

<a href="index.html" class="brand anim d1" aria-label="Kunzi 首页">Kunzi<i>.</i></a>
<nav class="nav anim d1" aria-label="主导航">
  <a href="index.html">首页</a>
  <a href="work.html">作品</a>
  <a href="about.html">关于</a>
  <a href="agent.html" aria-current="page">Agent</a>
</nav>

<main id="main" class="shell">
  <div class="agent-main">
    <div class="topline anim d2">
      <h1>Kunzi 的 Agent<i>.</i></h1>
      <button type="button" id="reset-chat">新对话 ↗</button>
    </div>
    <p class="note anim d2">交互演示，尚未接入 AI。回复是本地预设，消息不会上传。</p>

    <div class="chat">
      <div class="welcome" id="chat-welcome">
        <div class="face anim d2" aria-hidden="true"><span></span><span></span></div>
        <h2 class="anim d3">从一个问题开始。</h2>
        <div class="chips anim d3">
          <button type="button" data-prompt="介绍这个网站">介绍这个网站 ↗</button>
          <button type="button" data-prompt="未来你能做什么？">未来能做什么？ ↗</button>
        </div>
      </div>
      <div id="messages" class="messages" role="log" aria-label="演示对话" aria-live="polite" aria-relevant="additions" hidden></div>
      <form id="chat-form" autocomplete="off">
        <label for="message-input" class="sr-only">输入演示消息</label>
        <textarea id="message-input" name="message" placeholder="输入你的问题…" rows="1" maxlength="1000" required></textarea>
        <button type="submit" class="send" aria-label="发送消息">↑</button>
      </form>
    </div>
  </div>
</main>

<footer class="foot">
  <div class="foot__inner">
    <span>© Kunzi</span>
    <span>保持好奇。</span>
  </div>
</footer>

<script src="app.js?v=4" defer></script>
</body>
</html>
